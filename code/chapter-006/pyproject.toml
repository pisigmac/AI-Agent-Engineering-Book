[project]
name = "ai-agent-platform-chapter-006"
version = "0.1.0"
description = "Chapter 6 async HTTP and concurrency toolkit"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
