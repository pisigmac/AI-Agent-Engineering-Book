[project]
name = "ai-agent-platform-chapter-001"
version = "0.1.0"
description = "Chapter 1 scaffold for AI Agent Engineering Bootcamp"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
